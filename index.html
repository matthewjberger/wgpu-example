<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rust/Wgpu</title>
        <base href="/wgpu-example/" />
        <style type="text/css">
            :focus {
                outline: none;
            }

            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .root {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .main-canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    <link rel="modulepreload" href="/wgpu-example/app_core-261f0c3a26445870.js" crossorigin="anonymous" integrity="sha384-e1j9njQ9y/Sp6VymUyJkpS4uJK+5oX7KHNQQU3wUlUXp227nIN2aaaGU+qMAsA5u"><link rel="preload" href="/wgpu-example/app_core-fa7a8f22082a4337_bg.wasm" crossorigin="anonymous" integrity="sha384-TGQiyfNG7dGqX8vB5x3qGJyzzUuDiSObLQuEiMQ6I0aGNyzgj9C4ACrMQ8YYsct2" as="fetch" type="application/wasm"></head>

    <body>
        
<script type="module">
import init, * as bindings from '/wgpu-example/app_core-261f0c3a26445870.js';
const wasm = await init({ module_or_path: '/wgpu-example/app_core-fa7a8f22082a4337_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
        <div class="root">
            <canvas class="main-canvas" id="canvas"></canvas>
        </div>
        <script>
            function resizeCanvas() {
                const canvas = document.getElementById("canvas");
                const dpr = window.devicePixelRatio || 1;
                const width = window.innerWidth;
                const height = window.innerHeight;

                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
        </script>
    </body>
</html>
