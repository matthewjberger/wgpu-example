<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rust/Wgpu</title>
        <base href="wgpu-example/" />
        <style type="text/css">
            :focus {
                outline: none;
            }

            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .root {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .main-canvas {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    <link rel="modulepreload" href="wgpu-example/app_core-2c28dba2704396f9.js" crossorigin="anonymous" integrity="sha384-g0h7ljBqNpGVxPmO9/ORkkhynDe+AirlUPEy3DxAPTgCbx4sBwW+6Zp95pSTAd4R"><link rel="preload" href="wgpu-example/app_core-6aa9ecb6225b617f_bg.wasm" crossorigin="anonymous" integrity="sha384-vTOivF5tz2m5H4yyoZpS1CwnIarfGUfHPfUG6eWpSCcikoOjOt+sv8UX1iUOFZBJ" as="fetch" type="application/wasm"></head>

    <body>
        
<script type="module">
import init, * as bindings from 'wgpu-example/app_core-2c28dba2704396f9.js';
const wasm = await init({ module_or_path: 'wgpu-example/app_core-6aa9ecb6225b617f_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
        <div class="root">
            <canvas class="main-canvas" id="canvas"></canvas>
        </div>
        <script>
            function resizeCanvas() {
                const canvas = document.getElementById("canvas");
                const dpr = window.devicePixelRatio || 1;
                const width = window.innerWidth;
                const height = window.innerHeight;

                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
            }
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
        </script>
    </body>
</html>
